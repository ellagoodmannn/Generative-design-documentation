<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Rectangle</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a1a; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
    canvas { display: block; max-width: 100vw; max-height: 100vh; }
  </style>
</head>
<body>
<script>
// Base canvas dimensions (1080x1920)
const BASE_W = 1080;
const BASE_H = 1920;

const sizes = [
  { w: 288, h: 96  },
  { w: 288, h: 288 },
  { w: 288, h: 480 },
  { w: 288, h: 672 },
];

const ellipseSizes = [
  { w: 96,     h: 84.48  },
  { w: 175.87, h: 167.35 },
  { w: 224.73, h: 210.01 },
  { w: 273.65, h: 255.73 },
  { w: 371.75, h: 347.41 },
  { w: 488.38, h: 456.40 },
];

let currentSize;
let currentEllipseSize;
let currentColor = '#342940';
let switchInterval = 5;
let frameCount2 = 0;
let scale;

function setup() {
  const cnv = createCanvas(windowWidth, windowHeight);
  currentSize = sizes[0];
  currentEllipseSize = ellipseSizes[0];
  rectMode(CORNER);
  noStroke();
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
}

function pickNext() {
  const outcome = Math.floor(Math.random() * 7) + 1;
  if (outcome === 1) { currentSize = sizes[0]; }
  else if (outcome === 2) { currentSize = sizes[1]; }
  else if (outcome === 3) { currentSize = sizes[2]; }
  else if (outcome === 4) { currentSize = sizes[3]; }
  else if (outcome === 5) { currentColor = '#411a1e'; }
  else if (outcome === 6) { currentColor = '#938840'; }
  else if (outcome === 7) { currentColor = '#342940'; }

  currentEllipseSize = ellipseSizes[Math.floor(Math.random() * ellipseSizes.length)];
}

function draw() {
  background('#ccd2ce');

  frameCount2++;
  if (frameCount2 >= switchInterval) {
    frameCount2 = 0;
    pickNext();
  }

  // Scale factor to map base 1080x1920 coords to actual window size
  scale = min(width / BASE_W, height / BASE_H);

  push();
  translate((width - BASE_W * scale) / 2, (height - BASE_H * scale) / 2);
  applyMatrix(scale, 0, 0, scale, 0, 0);

  // Rectangle
  fill(currentColor);
  rect(BASE_W * 0.25, BASE_H - currentSize.h - 150, currentSize.w, currentSize.h);

  // Ellipse
  const tallestH = sizes[3].h;
  const rectBottom = BASE_H - 150;
  const tallestCenterY = rectBottom - tallestH / 2;
  fill('#342940');
  ellipse(BASE_W * 0.75, tallestCenterY, currentEllipseSize.w, currentEllipseSize.h);

  pop();
}
</script>
</body>
</html>
